<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="What stays in the application and what crosses to the model">
  <style>
    .bg { fill:#0f1114; }
    .panel { fill:#16191d; stroke:#2a2f36; }
    .panel2 { fill:#1c2025; stroke:#2a2f36; }
    .text { fill:#e6e8ea; }
    .muted { fill:#98a2ad; }
    .accent { fill:#46b8a9; }
    .bad { fill:#e07a6b; }
    .good { fill:#7fc8a9; }
    .line { stroke:#2a2f36; }
    .arrow { stroke:#98a2ad; }
    @media (prefers-color-scheme: light) {
      .bg { fill:#ffffff; }
      .panel { fill:#f7f8f9; stroke:#dfe3e7; }
      .panel2 { fill:#eef0f2; stroke:#dfe3e7; }
      .text { fill:#14171a; }
      .muted { fill:#5b6570; }
      .accent { fill:#0f7f74; }
      .bad { fill:#b3261e; }
      .good { fill:#1f7a4d; }
      .line { stroke:#dfe3e7; }
      .arrow { stroke:#5b6570; }
    }
  </style>
  <rect class="bg" width="960" height="330" rx="12"/>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="context-stroke"/>
    </marker>
  </defs>
  <text class="accent" x="24" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" text-anchor="start" letter-spacing="2">fica na aplicação</text>
  <rect class="panel" x="24" y="48" width="452" height="190" rx="10" stroke-width="1"/>
  <text class="text" x="44" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start">texto bruto, PDF e imagem</text>
  <text class="text" x="44" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start">OCR Tesseract e parser</text>
  <text class="text" x="44" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start">campos revistos do formulário</text>
  <text class="text" x="44" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start">PREVENT e guardrails</text>
  <text class="text" x="44" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start">trilha de ferramentas</text>
  <text class="text" x="44" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start">estado da sessão</text>
  <text class="bad" x="508" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" text-anchor="start" letter-spacing="2">cruza para o motor</text>
  <rect class="panel2" x="508" y="48" width="428" height="190" rx="10" stroke-width="1"/>
  <text class="text" x="528" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start">apenas os campos estruturados</text>
  <text class="text" x="528" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start">sem nome, documento ou contacto</text>
  <text class="text" x="528" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start">HTTPS 443, IP público fixado</text>
  <text class="text" x="528" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start">sem proxy de ambiente</text>
  <text class="text" x="528" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" text-anchor="start">credencial só na sessão</text>
  <line class="arrow" x1="480" y1="143" x2="502" y2="143" stroke-width="1.4" marker-end="url(#head)"/>
  <text class="muted" x="24" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" text-anchor="start">o ficheiro e o texto bruto não são enviados; o modelo vê o caso, não o documento</text>
  <text class="text" x="24" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" text-anchor="start">não é certificação de conformidade, é redução de superfície</text>
</svg>
